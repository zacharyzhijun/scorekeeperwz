<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scorekeeper</title>
    <meta name="description" content="Score trackers for card games. Everything stays on your device." />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#11131a" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scorekeeper" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Scorekeeper</h1>
      <p class="tagline">Pick a game. Everything stays on this device.</p>
    </header>

    <main>
      <nav id="gameList" class="game-list" aria-label="Games"></nav>

      <p id="emptyNote" class="hint center hidden">
        No games are set up yet. Add one to <code>games.js</code>.
      </p>
    </main>

    <script src="home.js" type="module"></script>
  </body>
</html>
